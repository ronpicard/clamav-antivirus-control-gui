name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Linux packaging deps (deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client
          npm ci --prefix server --omit=dev

      - name: Build React client
        run: npm run build --prefix client

      - name: Build installers (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Collect installers (exclude unpacked dirs)
        shell: bash
        run: |
          mkdir -p installers
          shopt -s nullglob
          for f in release/*.dmg release/*.zip release/*.exe release/*.AppImage release/*.deb; do
            [[ -e "$f" ]] && cp -f "$f" installers/
          done
          ls -la installers/
          if [[ -z "$(ls -A installers)" ]]; then echo "No installer files in release/"; exit 1; fi

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: installers/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Stage files for GitHub Release
        run: |
          mkdir -p upload
          find dist-all -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.zip' \) -print -exec cp -f {} upload/ \;
          ls -la upload/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
