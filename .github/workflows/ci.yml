name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    # 60 matches release.yml. Windows release-profile compile + the new
    # axum integration test together push past the previous 45m cap on
    # cold caches (release adds LTO + codegen-units=1 + opt-level=s).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            fakeroot

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install npm workspaces
        run: |
          npm ci
          npm ci --prefix client

      - name: Stage Tauri bundle inputs
        run: npm run stage-tauri-bundle

      - name: cargo check (Tauri shell)
        working-directory: src-tauri
        run: cargo check --locked

      - name: node --test (build scripts)
        run: npm run test:scripts

      - name: cargo test (unit + axum router + strangler proxy)
        working-directory: src-tauri
        # No CLAMAV_GUI_NODE_PORT set: native routes are exercised, proxy
        # fall-through is skipped (it requires a running Node helper).
        run: cargo test --locked

      - name: Build unsigned bundles (smoke test)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx tauri build --ci
